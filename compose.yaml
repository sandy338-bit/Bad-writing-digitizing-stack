services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/scrawlguard.sqlite3
    volumes:
      - documents:/app/data
      - ocr-models:/root/.paddlex
    restart: unless-stopped
volumes:
  documents:
  ocr-models:
